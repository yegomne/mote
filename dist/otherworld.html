<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10112a"><meta name="description" content="태양의 유산: 이세계 전투편. 아홉 토템과 마법 연계로 슬라임부터 드래곤까지 도전하세요."><title>태양의 유산 · 이세계의 아홉 토템</title><link rel="icon" href="assets/sun.svg" type="image/svg+xml"><link rel="stylesheet" href="otherworld.css?v=2"></head>
<body>
<div class="world-bg" aria-hidden="true"></div>
<header class="bar"><div class="brand"><span class="brand-sun">✹</span><span>태양의 유산 <small>THE NINE REALMS</small></span></div><div class="header-actions"><span id="coinBadge" class="coin-badge">◈ 0</span><button id="soundToggle" class="round-action" aria-label="소리 켜기 또는 끄기">♫</button><button id="shopOpen" class="shop-action">상점 <span>↗</span></button></div></header>
<main class="game-shell">
  <div class="scene-line"><div><span id="actLabel" class="eyebrow">ACT I</span><h1 id="stageTitle">이세계의 첫 숨결</h1><p id="storyLine"></p></div><button id="journeyOpen" class="journey-button">여정 <span id="stageNumber">101</span> / 150</button></div>
  <section class="arena" aria-label="몬스터와 마법사 전투"><div class="arena-glow"></div><div class="arena-top"><span id="enemyKind" class="eyebrow">첫 조우</span><span id="turnLabel">0턴</span></div><div class="monster-stage"><div id="mageSprite" class="mage-sprite" data-pose="idle" role="img" aria-label="전투를 준비하는 마법사"></div><div id="monsterSprite" class="monster-sprite" data-pose="idle" role="img" aria-label="슬라임"></div><div id="spellProjectile" class="spell-projectile" aria-hidden="true"></div><div id="impactRing" class="impact-ring" aria-hidden="true"></div><div id="floatingText" class="floating-text" aria-live="polite"></div></div><div class="monster-name-row"><div><span class="mini-label">ENEMY</span><h2 id="enemyName">푸른 슬라임</h2></div><span id="enemyIntent" class="intent">반격 준비</span></div><div class="meter"><div id="enemyFill" class="meter-fill enemy-fill"></div></div><div class="meter-caption"><span id="enemyHp">0 / 0</span><span id="affinityHint"></span></div><div class="hero-line"><span class="hero-icon">✹</span><div class="hero-vitals"><div class="hero-title"><b>이세계의 마법사</b><span id="heroHp">140 / 140</span></div><div class="meter hero-meter"><div id="heroFill" class="meter-fill hero-fill"></div></div></div><span id="shieldLabel" class="shield-label">보호막 0</span></div></section>
  <div id="combatBanner" class="combat-banner" role="status">같은 색을 두 번 연속 맞추면 마법 발동</div>
  <div class="play-grid"><section class="puzzle" aria-label="전투 보석판"><div class="puzzle-head"><div><b>마법의 보석판</b><small id="boardSizeLabel">6 × 6</small></div><button id="shuffleButton" title="사용 가능한 매치가 없으면 자동으로 섞입니다">보석 섞기 <span id="shuffleCount">2</span></button></div><div id="board" class="gem-board" role="group" aria-label="보석 두 개를 터치하거나 스와이프해 맞추세요"></div><div class="board-guide"><span id="streakInfo">첫 매치로 마법을 충전하세요</span><span>1회 충전 · 2회 발동</span></div></section><aside class="side-panel"><div class="panel-card"><div class="panel-title"><b>아홉 토템</b><span>원소의 여정</span></div><div id="runeList" class="rune-list"></div></div><div class="panel-card guide-card"><b>현재 공략</b><p id="battleTip"></p><div id="scrollList" class="scroll-list"></div><button id="shopOpenAside" class="outline-button">획득한 코인으로 장비·스크롤 구매 →</button></div></aside></div>
</main>
<dialog id="dialog"><div id="dialogBody"></div><button id="dialogClose" class="dialog-close" aria-label="닫기">×</button></dialog>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="battle-game.mjs?v=2"></script></body></html>
